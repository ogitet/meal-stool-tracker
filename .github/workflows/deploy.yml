name: Deploy

on:
  push:
    branches: [main] # PRマージ = mainへのpush

concurrency:
  group: deploy
  cancel-in-progress: false

# GITHUB_TOKEN の権限は、コードの読み取りだけにする
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 固まったデプロイが、次のデプロイを待たせ続けないようにする
    env:
      VP_GIT_HOOKS: "0" # CI では git フックを入れない
    steps:
      # Actions はコミットの SHA で固定する（更新は Dependabot）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ と Node（.node-version）を用意し、lockfile どおりに依存を入れる。
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      # E2E とルールのテストは PR の CI で実行する。ここでは整形・lint・型と単体テストを最後の確認として残す
      - run: vp check
      - run: vp test run
      # 秘密の値はシェルの文に埋め込まず、環境変数で渡す（値に引用符があっても壊れず、文として解釈されない）
      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Build & deploy
        run: npm run deploy -- --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
