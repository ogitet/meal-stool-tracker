name: CI

# main への PR で、整形・lint・型（vp check）、単体テスト、ビルド、E2E、Firestore ルールのテストを走らせる。
# マージの前に、ここが通っていることを確かめる。
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN の権限は、コードの読み取りだけにする
permissions:
  contents: read

env:
  VP_GIT_HOOKS: "0" # CI では git フックを入れない（prepare の vp config を無効にする）

# Actions はタグではなくコミットの SHA で固定する（タグは後から付け替えられるため）。更新は Dependabot が PR を出す。
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ と Node（.node-version）を用意し、lockfile どおりに依存を入れる
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Format, lint & type check
        run: vp check
      - name: Unit tests
        run: vp test run
      - name: Type check & build
        run: npm run build

  # 画面の E2E（デモモードの画面を Chromium と WebKit で操作する。Firebase には接続しない）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E tests
        run: npm run test:e2e
      # 失敗したときの操作の記録（trace）を残す
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  # firestore.rules のテスト（Firestore エミュレーターで実行する。本番には接続しない）
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      # エミュレーターは Java で動く
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore rules tests
        run: npm run test:rules
