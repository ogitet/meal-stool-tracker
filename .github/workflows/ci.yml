name: CI

# main への PR で単体テストとビルドを走らせる。マージの前に、ここが通っていることを確かめる。
# E2E テストは時間がかかるため CI では実行せず、PR を出す前に手元で実行する（npm run test:e2e）。
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json # volta.node（Volta の固定）を読む
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check & build
        run: npm run build
